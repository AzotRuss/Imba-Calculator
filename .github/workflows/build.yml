name: Build Calculator Imba (Win + macOS)

on: [push, workflow_dispatch]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Download JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: master
          path: JUCE

      - name: Build Projucer
        shell: pwsh
        run: |
          $projucerSln = Get-ChildItem -Path "JUCE\extras\Projucer\Builds" -Filter "Projucer.sln*" -Recurse | Select-Object -First 1
          msbuild $projucerSln.FullName /p:Configuration=Release /p:Platform=x64

      - name: Generate & Resave .jucer
        shell: pwsh
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          mods = ['juce_audio_basics','juce_audio_devices','juce_audio_formats','juce_audio_plugin_client','juce_audio_processors','juce_audio_utils','juce_core','juce_data_structures','juce_events','juce_graphics','juce_gui_basics','juce_gui_extra']
          root = ET.Element('JUCERPROJECT', id='CalcImb1', name='Calculator Imba', projectType='audioplug', useAppConfig='0', addUsingNamespaceToJuceHeader='0', jucerFormatVersion='1', companyName='AzotRuss', pluginFormats='buildVST3,buildAU', pluginManufacturerCode='Azot', pluginCode='Clc1', pluginName='Calculator Imba', pluginDesc='Calculator Imba', pluginChannelConfigs='{1, 1}, {2, 2}')
          mg = ET.SubElement(root, 'MAINGROUP', id='MainGrp', name='Calculator Imba')
          sg = ET.SubElement(mg, 'GROUP', id='SrcGrp', name='Source')
          ET.SubElement(sg, 'FILE', id='bg1', name='bg.jpg', compile='0', resource='1', file='Source/bg.jpg')
          ET.SubElement(sg, 'FILE', id='f1', name='PluginProcessor.cpp', compile='1', resource='0', file='Source/PluginProcessor.cpp')
          ET.SubElement(sg, 'FILE', id='f2', name='PluginProcessor.h', compile='0', resource='0', file='Source/PluginProcessor.h')
          ET.SubElement(sg, 'FILE', id='f3', name='PluginEditor.cpp', compile='1', resource='0', file='Source/PluginEditor.cpp')
          ET.SubElement(sg, 'FILE', id='f4', name='PluginEditor.h', compile='0', resource='0', file='Source/PluginEditor.h')
          ms = ET.SubElement(root, 'MODULES')
          for m in mods: ET.SubElement(ms, 'MODULE', id=m, showAllCode='1', useLocalCopy='0', useGlobalPath='0')
          ef = ET.SubElement(root, 'EXPORTFORMATS')
          vs = ET.SubElement(ef, 'VS2022', targetFolder='Builds/VisualStudio2022')
          cf = ET.SubElement(vs, 'CONFIGURATIONS')
          ET.SubElement(cf, 'CONFIGURATION', isDebug='1', name='Debug', targetName='Calculator Imba')
          ET.SubElement(cf, 'CONFIGURATION', isDebug='0', name='Release', targetName='Calculator Imba')
          mp = ET.SubElement(vs, 'MODULEPATHS')
          for m in mods: ET.SubElement(mp, 'MODULEPATH', id=m, path='JUCE/modules')
          ET.ElementTree(root).write('Calculator Imba.jucer', encoding='utf-8', xml_declaration=True)
          "
          $projucerExe = Get-ChildItem -Path "JUCE\extras\Projucer\Builds" -Filter "Projucer.exe" -Recurse | Select-Object -First 1
          & $projucerExe.FullName --resave "Calculator Imba.jucer"

      - name: Build VST3
        shell: pwsh
        run: |
          $sharedProj = Get-ChildItem -Path "Builds" -Filter "*SharedCode.vcxproj" -Recurse | Select-Object -First 1
          if ($sharedProj) { msbuild $sharedProj.FullName /p:Configuration=Release /p:Platform=x64 }
          $vstProj = Get-ChildItem -Path "Builds" -Filter "*VST3.vcxproj" -Recurse | Select-Object -First 1
          msbuild $vstProj.FullName /p:Configuration=Release /p:Platform=x64 /p:PostBuildEventUseInBuild=false

          $dll = Get-ChildItem -Path "Builds" -Filter "*.dll" -Recurse | Where-Object { $_.FullName -like "*VST3*" } | Select-Object -First 1
          $bundleDir = "Output\Calculator Imba.vst3\Contents\x86_64-win"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          Copy-Item $dll.FullName (Join-Path $bundleDir "Calculator Imba.vst3") -Force

      - name: Build EXE Installer
        shell: pwsh
        run: |
          $iss = @"
          [Setup]
          AppName=Calculator Imba
          AppVersion=1.0
          DefaultDirName={commoncf}\VST3
          DisableDirPage=yes
          DisableProgramGroupPage=yes
          OutputDir=Installer
          OutputBaseFilename=CalculatorImba_Windows_Installer
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=admin

          [Files]
          Source: "Output\Calculator Imba.vst3\*"; DestDir: "{app}\Calculator Imba.vst3"; Flags: ignoreversion recursesubdirs createallsubdirs
          "@
          Set-Content -Path "setup.iss" -Value $iss
          iscc "setup.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: CalculatorImba-Windows-Installer
          path: Installer\CalculatorImba_Windows_Installer.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: master
          path: JUCE

      - name: Build Projucer
        run: xcodebuild -project JUCE/extras/Projucer/Builds/MacOSX/Projucer.xcodeproj -configuration Release

      - name: Generate & Resave .jucer
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          mods = ['juce_audio_basics','juce_audio_devices','juce_audio_formats','juce_audio_plugin_client','juce_audio_processors','juce_audio_utils','juce_core','juce_data_structures','juce_events','juce_graphics','juce_gui_basics','juce_gui_extra']
          root = ET.Element('JUCERPROJECT', id='CalcImb1', name='Calculator Imba', projectType='audioplug', useAppConfig='0', addUsingNamespaceToJuceHeader='0', jucerFormatVersion='1', companyName='AzotRuss', pluginFormats='buildVST3,buildAU', pluginManufacturerCode='Azot', pluginCode='Clc1', pluginName='Calculator Imba', pluginDesc='Calculator Imba', pluginChannelConfigs='{1, 1}, {2, 2}')
          mg = ET.SubElement(root, 'MAINGROUP', id='MainGrp', name='Calculator Imba')
          sg = ET.SubElement(mg, 'GROUP', id='SrcGrp', name='Source')
          ET.SubElement(sg, 'FILE', id='bg1', name='bg.jpg', compile='0', resource='1', file='Source/bg.jpg')
          ET.SubElement(sg, 'FILE', id='f1', name='PluginProcessor.cpp', compile='1', resource='0', file='Source/PluginProcessor.cpp')
          ET.SubElement(sg, 'FILE', id='f2', name='PluginProcessor.h', compile='0', resource='0', file='Source/PluginProcessor.h')
          ET.SubElement(sg, 'FILE', id='f3', name='PluginEditor.cpp', compile='1', resource='0', file='Source/PluginEditor.cpp')
          ET.SubElement(sg, 'FILE', id='f4', name='PluginEditor.h', compile='0', resource='0', file='Source/PluginEditor.h')
          ms = ET.SubElement(root, 'MODULES')
          for m in mods: ET.SubElement(ms, 'MODULE', id=m, showAllCode='1', useLocalCopy='0', useGlobalPath='0')
          ef = ET.SubElement(root, 'EXPORTFORMATS')
          xm = ET.SubElement(ef, 'XCODE_MAC', targetFolder='Builds/MacOSX')
          cf = ET.SubElement(xm, 'CONFIGURATIONS')
          ET.SubElement(cf, 'CONFIGURATION', isDebug='1', name='Debug', targetName='Calculator Imba')
          ET.SubElement(cf, 'CONFIGURATION', isDebug='0', name='Release', targetName='Calculator Imba')
          mp = ET.SubElement(xm, 'MODULEPATHS')
          for m in mods: ET.SubElement(mp, 'MODULEPATH', id=m, path='JUCE/modules')
          ET.ElementTree(root).write('Calculator Imba.jucer', encoding='utf-8', xml_declaration=True)
          "
          ./JUCE/extras/Projucer/Builds/MacOSX/build/Release/Projucer.app/Contents/MacOS/Projucer --resave "Calculator Imba.jucer"

      - name: Build Plugin (Universal)
        run: xcodebuild -project "Builds/MacOSX/Calculator Imba.xcodeproj" -configuration Release -alltargets ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO

      - name: Package macOS Installer
        run: |
          mkdir -p pkg_root/Library/Audio/Plug-Ins/VST3
          mkdir -p pkg_root/Library/Audio/Plug-Ins/Components
          mkdir -p Installer
          find Builds/MacOSX/build/Release -name "*.vst3" -exec cp -R {} pkg_root/Library/Audio/Plug-Ins/VST3/ \;
          find Builds/MacOSX/build/Release -name "*.component" -exec cp -R {} pkg_root/Library/Audio/Plug-Ins/Components/ \;
          pkgbuild --root pkg_root --identifier com.azotruss.calculatorimba --version 1.0 Installer/CalculatorImba_macOS_Installer.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: CalculatorImba-macOS-Installer
          path: Installer/CalculatorImba_macOS_Installer.pkg
