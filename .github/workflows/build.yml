
name: Build Calculator Imba (Win + macOS)

on: [push, workflow_dispatch]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: master
          path: JUCE

      - name: Generate CMakeLists.txt
        shell: pwsh
        run: |
          $cmake = @"
          cmake_minimum_required(VERSION 3.22)
          project(CalculatorImba VERSION 1.0.0)
          set(CMAKE_CXX_STANDARD 17)
          add_subdirectory(JUCE)

          juce_add_plugin(CalculatorImba
              COMPANY_NAME "AzotRuss"
              IS_SYNTH FALSE
              NEEDS_MIDI_INPUT FALSE
              NEEDS_MIDI_OUTPUT FALSE
              IS_MIDI_EFFECT FALSE
              PLUGIN_MANUFACTURER_CODE Azot
              PLUGIN_CODE Clc1
              FORMATS VST3
              PRODUCT_NAME "Calculator Imba")

          juce_generate_juce_header(CalculatorImba)

          juce_add_binary_data(CalculatorImbaData SOURCES Source/bg.jpg)

          target_sources(CalculatorImba PRIVATE
              Source/PluginProcessor.cpp
              Source/PluginEditor.cpp)

          target_compile_definitions(CalculatorImba PUBLIC
              JUCE_WEB_BROWSER=0
              JUCE_USE_CURL=0
              JUCE_VST3_CAN_REPLACE_VST2=0)

          target_link_libraries(CalculatorImba PRIVATE
              CalculatorImbaData
              juce::juce_audio_utils
              juce::juce_audio_processors
              juce::juce_gui_extra
              juce::juce_graphics
              juce::juce_gui_basics
              juce::juce_core
              juce::juce_data_structures
              juce::juce_events
              juce::juce_audio_basics
              juce::juce_audio_devices
              juce::juce_audio_formats
              juce::juce_audio_plugin_client
              PUBLIC
              juce::juce_recommended_config_flags
              juce::juce_recommended_lto_flags
              juce::juce_recommended_warning_flags)
          "@
          Set-Content -Path "CMakeLists.txt" -Value $cmake

      - name: Build VST3
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Build EXE Installer
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path "build" -Filter "Calculator Imba.vst3" -Recurse -Directory | Select-Object -First 1
          $iss = @"
          [Setup]
          AppName=Calculator Imba
          AppVersion=1.0
          DefaultDirName={commoncf}\VST3
          DisableDirPage=yes
          DisableProgramGroupPage=yes
          OutputDir=Installer
          OutputBaseFilename=CalculatorImba_Windows_Installer
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=admin

          [Files]
          Source: "$($vst3.FullName)\*"; DestDir: "{app}\Calculator Imba.vst3"; Flags: ignoreversion recursesubdirs createallsubdirs
          "@
          Set-Content -Path "setup.iss" -Value $iss
          iscc "setup.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: CalculatorImba-Windows-Installer
          path: Installer\CalculatorImba_Windows_Installer.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: master
          path: JUCE

      - name: Generate CMakeLists.txt
        run: |
          cat << 'EOF' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.22)
          project(CalculatorImba VERSION 1.0.0)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_OSX_ARCHITECTURES "arm64;x86_64" CACHE STRING "" FORCE)
          add_subdirectory(JUCE)

          juce_add_plugin(CalculatorImba
              COMPANY_NAME "AzotRuss"
              IS_SYNTH FALSE
              NEEDS_MIDI_INPUT FALSE
              NEEDS_MIDI_OUTPUT FALSE
              IS_MIDI_EFFECT FALSE
              PLUGIN_MANUFACTURER_CODE Azot
              PLUGIN_CODE Clc1
              FORMATS VST3 AU
              PRODUCT_NAME "Calculator Imba")

          juce_generate_juce_header(CalculatorImba)

          juce_add_binary_data(CalculatorImbaData SOURCES Source/bg.jpg)

          target_sources(CalculatorImba PRIVATE
              Source/PluginProcessor.cpp
              Source/PluginEditor.cpp)

          target_compile_definitions(CalculatorImba PUBLIC
              JUCE_WEB_BROWSER=0
              JUCE_USE_CURL=0
              JUCE_VST3_CAN_REPLACE_VST2=0)

          target_link_libraries(CalculatorImba PRIVATE
              CalculatorImbaData
              juce::juce_audio_utils
              juce::juce_audio_processors
              juce::juce_gui_extra
              juce::juce_graphics
              juce::juce_gui_basics
              juce::juce_core
              juce::juce_data_structures
              juce::juce_events
              juce::juce_audio_basics
              juce::juce_audio_devices
              juce::juce_audio_formats
              juce::juce_audio_plugin_client
              PUBLIC
              juce::juce_recommended_config_flags
              juce::juce_recommended_lto_flags
              juce::juce_recommended_warning_flags)
          EOF

      - name: Build VST3 & AU (Universal)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package macOS Installer
        run: |
          mkdir -p pkg_root/Library/Audio/Plug-Ins/VST3
          mkdir -p pkg_root/Library/Audio/Plug-Ins/Components
          mkdir -p Installer
          find build -name "*.vst3" -exec cp -R {} pkg_root/Library/Audio/Plug-Ins/VST3/ \;
          find build -name "*.component" -exec cp -R {} pkg_root/Library/Audio/Plug-Ins/Components/ \;
          pkgbuild --root pkg_root --identifier com.azotruss.calculatorimba --version 1.0 Installer/CalculatorImba_macOS_Installer.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: CalculatorImba-macOS-Installer
          path: Installer/CalculatorImba_macOS_Installer.pkg
